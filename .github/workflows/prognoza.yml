name: Prognoza gljiva
on:
  schedule:
    - cron: '35 8 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/prognoza/**', '.github/workflows/prognoza.yml']
permissions:
  contents: write
concurrency:
  group: prognoza
  cancel-in-progress: false
jobs:
  prognoza:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Biblioteke
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libeccodes-dev >/dev/null
          pip install -q numpy eccodes ecmwf-opendata shapely pillow
      - name: Prošla arhiva
        run: |
          mkdir -p /tmp/stara
          git fetch -q origin prognoza-podaci && git show origin/prognoza-podaci:arhiva.npz > /tmp/stara/arhiva.npz || echo "nema arhive"
      - name: Izračun
        env:
          BUDGET_MIN: '30'
        run: |
          mkdir -p /tmp/out
          python3 -u tools/prognoza/prognoza.py /tmp/out /tmp/stara/arhiva.npz 2>&1 | tee /tmp/out/log.txt
          test -f /tmp/out/prognoza.json
      - name: Objava na granu prognoza-podaci
        if: always()
        run: |
          cd /tmp/out
          git init -q -b prognoza-podaci
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Prognoza $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prognoza-podaci
